version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disenyorita-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - BACKEND_PORT=8000
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
    volumes:
      # Mount for development - comment out for production
      - ./backend:/app
      - /app/.venv  # Exclude virtual environment
    networks:
      - disenyorita-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import requests; requests.get('http://localhost:8000/api/v1/health', timeout=2)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    container_name: disenyorita-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - FRONTEND_PORT=3000
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
      - API_BASE_INTERNAL=${API_BASE_INTERNAL:-http://backend:8000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - disenyorita-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  disenyorita-network:
    driver: bridge

# Optional: For production, add volumes for persistent data
# volumes:
#   postgres_data:
#   redis_data:
